<body>
  <script>if (sessionStorage.getItem("tyes_auth") !== "1" && document.cookie.indexOf("tyes_auth=1") === -1) window.location.href = "index.html";</script>

  <div id="root"></div>

  <script>
    // Intercept clicks on the React-rendered buttons and nav links on the splash page
    document.addEventListener('click', function (e) {
      const target = e.target.closest('a') || e.target.closest('button');
      if (!target) return;

      const text = (target.textContent || "").trim();
      if (text.includes('Use Cases')) {
        e.preventDefault();
        e.stopPropagation();
        window.location.href = '/main.html#use-cases';
      } else if (text.includes('Pricing')) {
        e.preventDefault();
        e.stopPropagation();
        window.location.href = '/pricing.html';
      } else if (text.includes('About')) {
        e.preventDefault();
        e.stopPropagation();
        window.location.href = '/about.html';
      } else if (text.includes('How It Works')) {
        e.preventDefault();
        e.stopPropagation();
        window.location.href = '/how-it-works.html';
      } else if (text.includes('Get Your Free Image') || text.includes('Get Your Free Strategy') || text.includes('Get Started') || text.includes('Get My Free Strategy')) {
        e.preventDefault();
        e.stopPropagation();
        window.location.href = '/main.html';
      }
    }, true); // Use capture phase to intercept before React handles it
  </script>
